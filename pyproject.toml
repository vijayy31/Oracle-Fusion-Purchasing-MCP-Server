[project]
name = "oracle-fusion-purchasing-mcp"
version = "0.1.3"
description = "An MCP server for interacting with Oracle Fusion Cloud Purchasing APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=4.1.0",
    "httpx>=0.28.1"
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
oracle-fusion-purchasing-mcp = "oracle_fusion_purchasing_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "twine>=7.0.0",
]
